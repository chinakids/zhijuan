# sdk profile：织卷创作的 agent 边车（DeepSeek Harness SDK runtime）
# 本文件是静态基础层：jsonrpc 边车 + 织卷写作工具 zj-core。
# LLM 端点有两层：默认用下方 llm-pi-ai（本机 vLLM），若主进程检测到设置里的
# 端点不同，会另行生成 run/llm.override.patch.yml 并以 --patch 叠加（后者胜出）。
- id: llm-pi-ai
  config:
    providers:
      local-vllm:
        displayName: Local vLLM (127.0.0.1)
        apiKeyEnv: LOCAL_LLM_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8888/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          chatTemplateKwargs:
            thinking: false
        models:
          - id: deepseek-v4-flash-vision-exp-uncensored
            reasoningEfforts: {"low":"low","high":"high","max":"max"}
- id: agent-default-model
  config:
    provider: local-vllm
    model: deepseek-v4-flash-vision-exp-uncensored
- insert:
    - id: jsonrpc
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [agents]
    - id: zj-core
      name: 'zj-core'
    - id: zj-questions
      name: 'zj-questions'
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
# 写作以串行为主：允许多个 in_progress 会让 todo 卡显得喧嚣；这里覆盖 base 的默认并行配置。
- id: tool-todo
  config:
    allowParallelInProgress: false
