# 织卷 electron-builder 配置（2026-09-12 主人要求双端打包）
# mac：dmg（本机直打，无签名 identity=null）；win：nsis + portable（本机需 wine 或 GitHub Actions）
appId: com.zhijuan.desktop
productName: 织卷
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: scripts/afterPackMacos.js
extraResources:
  - from: dsh-runtime
    to: dsh-runtime
    filter:
      - '**/*'
      - '!testwork/**'
      - '!*.log'
mac:
  target:
    - target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
  # 2026-10-26 按 daily_stock_analysis#2101 缓解：明确 unsigned（identity null + hardenedRuntime false），
  # 由 afterPack hook 递归清除失效的 Electron 预置残缺签名→干净无签名，避免被 Gatekeeper 判「损坏移废纸篓」。
  # 无 Apple 开发者证书，无法 notarize；unsigned 仍不受 Apple 信任，需「右键打开/仍要打开」。
  identity: null
  hardenedRuntime: false
  artifactName: zhijuan-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: zhijuan-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 织卷
