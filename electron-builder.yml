# 织卷 electron-builder 配置（2026-09-12 主人要求双端打包）
# mac：dmg（本机直打，无签名 identity=null）；win：nsis + portable（本机需 wine 或 GitHub Actions）
appId: com.zhijuan.desktop
productName: 织卷
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: scripts/afterPackMacos.js
extraResources:
  # 2026-10-28：pi 内核取代 dsh（engineCore 默认 'pi'）。dsh-runtime（308M）不再随包；
  # dev 工作区仍保留 dsh-runtime，供 engineCore='dsh' 回退与 scripts/dsh-boot-check 使用。
  # pi 独立运行时树（149M），piRuntime 从 resources/pi-runtime 解析。
  # pi 内核（2026-10-28 替换 dsh）：独立运行时树，piRuntime 从 resources/pi-runtime 解析
  - from: build/pi-runtime/node_modules
    to: pi-runtime/node_modules
    filter:
      - '**/*'
mac:
  target:
    - target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
  # 2026-10-26 按 Gatekeeper unsigned 诊断（blog.margrop.net）：afterPack hook 对整包做 ad-hoc 签名
  # （codesign --force --deep --sign -），覆盖失效的 Electron 残缺签名并提供可 verify 的签名结构；
  # 配合用户移除 quarantine 即可正常打开（非 Developer ID/公证，spctl 仍 rejected，仅作本地可信分发）。
  identity: null
  hardenedRuntime: false
  artifactName: zhijuan-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: zhijuan-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 织卷
