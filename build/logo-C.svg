  <text x="512" y="470" text-anchor="middle" dominant-baseline="central"
        font-family="'PingFang SC','Heiti SC','Hiragino Sans GB',sans-serif"
        font-weight="500" font-size="380" fill="#f2eee4">织</text>
  <line x1="330" y1="700" x2="694" y2="700" stroke="#0f766e" stroke-width="16" stroke-linecap="round"/>
  <line x1="330" y1="700" x2="694" y2="700" stroke="#6fbcb3" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
