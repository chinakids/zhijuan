      <stop offset="0" stop-color="#2b2822"/>
      <stop offset="1" stop-color="#15130f"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
