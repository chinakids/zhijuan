<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#ece7db"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0a4f48"/>
    </linearGradient>
  </defs>
  <rect x="56" y="56" width="912" height="912" rx="208" fill="url(#p)"/>
  <rect x="56" y="56" width="912" height="912" rx="208" fill="none" stroke="#d8d1c4" stroke-width="6"/>
  <!-- 经纬交叉：「经」一道（青黛，左上→右下）、「纬」一道（暖墨，右上→左下），交接处留白=织结 -->
  <g fill="none" stroke-linecap="round">
    <path d="M 300 620 L 724 404" stroke="#2d2a24" stroke-width="110" opacity="0.9"/>
    <path d="M 300 404 L 724 620" stroke="url(#band)" stroke-width="110"/>
  </g>
  <circle cx="512" cy="512" r="86" fill="url(#p)"/>
  <circle cx="512" cy="512" r="38" fill="url(#band)"/>
</svg>
