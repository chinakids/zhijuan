<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;background:transparent}
  .tile{width:1024px;height:1024px;border-radius:230px;
    background:linear-gradient(135deg,#2c857a 0%,#14615a 58%,#0e4a45 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -14px 30px rgba(0,0,0,.18)}
  .glyph{font-family:"Songti SC",serif;font-weight:600;font-size:520px;line-height:1;
    color:#fdfbf5;letter-spacing:-4px;text-shadow:0 6px 26px rgba(0,0,0,.22)}
  .seal{position:absolute;top:190px;left:150px;width:120px;height:120px;border-radius:26px;
    background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35)}
</style></head>
<body><div class="tile" style="position:relative"><div class="seal"></div><div class="glyph">织</div></div></body></html>
