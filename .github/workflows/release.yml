name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package macOS (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      # 版本一致性门禁（2026-10-27）：electron-builder 按 package.json.version 出包，
      # 打错的 tag（v0.2.0 + version 0.1.0）会把 zhijuan-0.1.0.dmg 挂到 v0.2.0 的 Release 上。
      # matrix 每个 arch 都在最前面断言，失败即整条流水线红。
      - name: Assert tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "非 tag 触发（${GITHUB_REF_TYPE:-none} ${GITHUB_REF_NAME}），跳过 tag/version 校验"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME} package.json=${pkg_version}"
          if [[ "${tag_version}" != "${pkg_version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json version ${pkg_version} 不一致；先 npm version ${tag_version#v} 再打 tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # vendored 写作引擎（独立依赖树，install.sh 幂等；CI 上重建以打包进 extraResources）
      - name: Install dsh-runtime
        run: bash dsh-runtime/install.sh

      - name: Build
        run: npm run build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Package (${{ matrix.arch }})
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 签名自检（2026-10-27）：afterPack 的 ad-hoc 签名必须真能 verify 通过。
      # 反面教材：extraResources 曾带入 dshhome/profiles/node_modules（165 个指向构建机的绝对路径
      # symlink），整包签名 verify 报 435 处 file modified —— 用户侧表现正是「已损坏，移到废纸篓」。
      - name: Audit macOS signature
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then dir=release/mac-arm64; else dir=release/mac; fi
          app="$(ls -d "$dir"/*.app | head -1)"
          echo "审计 $app"
          bash scripts/macos-signature-audit.sh check "$app"

      # 产物名校验（2026-10-27）：artifactName 由 version/arch 拼出，打包完先核对真名，
      # 免得 upload 步骤只报「no files found」，看不出是 version 写错还是 arch 写错。
      - name: Assert packaged dmg name
        run: |
          v="$(node -p "require('./package.json').version")"
          expected="release/zhijuan-${v}-mac-${{ matrix.arch }}.dmg"
          ls -lh release
          test -f "$expected" || { echo "::error::预期产物不存在：$expected"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhijuan-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*.dmg
